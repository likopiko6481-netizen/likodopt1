<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Likodopt</title>
<script src="https://unpkg.com"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:url('./bg.png') center/cover fixed,#0f1115;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:15px}
.app{background:rgba(24,27,34,.92);width:100%;max-width:420px;border-radius:20px;padding:20px;border:1px solid #262a35}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.logo{font-size:1.4rem;font-weight:800;color:#00e676}
.box{background:#12141a;border-radius:15px;padding:20px;text-align:center;margin-bottom:12px}
.chat{background:#12141a;border-radius:12px;height:150px;display:flex;flex-direction:column;margin-bottom:12px;overflow:hidden}
#msgs{flex:1;padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.m{padding:6px 10px;border-radius:8px;max-width:80%}
.me{background:#00e676;color:#000;align-self:flex-end}
.he{background:#262b38;align-self:flex-start}
.sys{color:#788292;align-self:center;font-size:.8rem}
form{display:flex;border-top:1px solid #222}
input{flex:1;background:none;border:none;padding:10px;color:#fff;outline:none}
button{cursor:pointer;border:none;font-weight:700;border-radius:10px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{padding:14px;font-size:1rem}
.btn:disabled{opacity:.4}
#b1{background:#00e676;color:#000}
#b2{background:#ff5252;color:#fff}
#b3{grid-column:span 2;background:#262b38;color:#fff}
.ck{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:92%;max-width:420px;background:#181b22;border:1px solid #00e676;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:.85rem}
</style>
</head>
<body>
<div class="app">
  <div class="top"><span class="logo">LIKODOPT</span><span id="net" style="font-size:.85rem;color:#00e676">● В сети</span></div>
  <div class="box"><div id="ico" style="font-size:2.2rem;margin-bottom:8px">🎙️</div><div id="st">Нажмите «Найти / Далее»</div></div>
  <div class="chat"><div id="msgs"></div><form id="f"><input id="i" placeholder="Сообщение..." disabled><button id="s" disabled style="background:none;color:#00e676;padding:0 15px">➤</button></form></div>
  <div class="btns"><button class="btn" id="b1">Найти / Далее</button><button class="btn" id="b2" disabled>Стоп</button><button class="btn" id="b3" disabled>Выключить микрофон</button></div>
  <audio id="a" autoplay playsinline></audio>
</div>
<div class="ck" id="ck"><span>🍪 Мы используем ваши файлы <b style="color:#00e676">Cookie</b> для улучшения работы сайта.</span><button onclick="this.parentElement.remove()" style="background:#262b38;color:#fff;width:28px;height:28px;border-radius:50%">✕</button></div>
<script>
let p=null,c=null,d=null,st=null,m=false,run=false;
const $=id=>document.getElementById(id);
const log=(t,k)=>{const e=document.createElement('div');e.className='m '+k;e.textContent=t;$('msgs').appendChild(e);$('msgs').scrollTop=9999};
const ui=(ic,tx,on)=>{$('ico').textContent=ic;$('st').textContent=tx;$('i').disabled=!on;$('s').disabled=!on};
function end(msg){run=false;if(c)c.close();if(d)d.close();if(p)p.destroy();c=d=p=null;ui('🎙️',msg,false)}
function bindD(x){d=x;d.on('open',()=>{run=false;ui('🎧','Собеседник на связи!',true);$('msgs').innerHTML='';log('Собеседник найден!','sys')});d.on('data',t=>log(t,'he'));d.on('close',()=>end('Собеседник отключился'))}
function bindC(x){c=x;c.on('stream',s=>{$('a').srcObject=s;$('a').play().catch(()=>{})})}
function tryRoom(n){
  if(!run)return;
  const id='likodopt_ru_room_'+n;
  p=new Peer({config:{iceServers:[{urls:'stun:://google.com'}]}});
  p.on('open',()=>{
    const conn=p.connect(id);
    const t=setTimeout(()=>{if(run){p.destroy();hostRoom(id)}},1500);
    conn.on('open',()=>{clearTimeout(t);bindD(conn);if(st)bindC(p.call(id,st))});
  });
}
function hostRoom(id){
  if(!run)return;
  p=new Peer(id,{config:{iceServers:[{urls:'stun:://google.com'}]}});
  p.on('connection',conn=>{if(run)bindD(conn)});
  p.on('call',call=>{call.answer(st||undefined);bindC(call)});
  p.on('error',()=>{if(run){p.destroy();tryRoom(Math.floor(Math.random()*10)+1)}});
}
$('b1').onclick=async()=>{
  end('Поиск...');run=true;$('b2').disabled=false;$('msgs').innerHTML='';ui('🔍','Ищем собеседника (Очередь)...',false);
  if(!st&&navigator.mediaDevices)try{st=await navigator.mediaDevices.getUserMedia({audio:true});$('b3').disabled=false}catch(e){}
  tryRoom(1);
};
$('b2').onclick=()=>{$('b2').disabled=true;end('Поиск остановлен')};
$('b3').onclick=()=>{if(!st)return;m=!m;st.getAudioTracks().forEach(t=>t.enabled=!m);$('b3').textContent=m?'Включить микрофон':'Выключить микрофон'};
$('f').onsubmit=e=>{e.preventDefault();const v=$('i').value.trim();if(!v||!d)return;log(v,'me');d.send(v);$('i').value=''};
</script>
</body>
</html>
