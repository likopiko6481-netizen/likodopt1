<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIKODOPT</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
  body {
    background: #0b0d12 url('./bg.png') center/cover no-repeat fixed;
    background-image: url('./bg.png'), url('./bg.jpg'), url('./bg.jpeg'), url('./bg.webp');
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 15px;
  }
  .app {
    background: rgba(20, 23, 31, 0.94);
    width: 100%;
    max-width: 440px;
    border-radius: 22px;
    padding: 20px;
    border: 1px solid #333;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .logo { font-size: 1.4rem; font-weight: 900; color: #00e676; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mbtn { padding: 10px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; background: #1e2330; color: #94a3b8; }
  .mbtn.on { background: #00e676; color: #000; }
  .box { background: #0e1016; border-radius: 16px; padding: 20px; text-align: center; min-height: 150px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .grid6 { display: none; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; margin-bottom: 8px; }
  .seat { background: #1a1f2b; border: 1px solid #2c3345; border-radius: 10px; padding: 8px 4px; font-size: 0.75rem; color: #64748b; }
  .seat.busy { background: #163326; border-color: #00e676; color: #fff; }
  .chat { background: #0e1016; border-radius: 14px; height: 140px; display: flex; flex-direction: column; overflow: hidden; }
  #msgs { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 0.88rem; }
  .m { padding: 6px 10px; border-radius: 10px; max-width: 82%; }
  .me { background: #00e676; color: #000; align-self: flex-end; font-weight: 600; }
  .he { background: #232836; align-self: flex-start; }
  .sys { color: #94a3b8; align-self: center; font-size: 0.78rem; }
  form { display: flex; border-top: 1px solid #222; }
  input { flex: 1; background: none; border: none; padding: 10px; color: #fff; outline: none; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { padding: 14px; border: none; border-radius: 12px; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #b1 { background: #00e676; color: #000; }
  #b2 { background: #ff5252; color: #fff; }
  #b3 { grid-column: span 2; background: #232836; color: #fff; }
  .ck { position: fixed; top: 10px; left: 10px; right: 10px; max-width: 440px; margin: auto; background: #14171f; border: 1px solid #00e676; border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; z-index: 9999; font-size: 0.82rem; }
</style>
</head>
<body>

<div class="ck" id="ck">
  <span>🍪 Мы используем файлы <b style="color:#00e676">Cookie</b></span>
  <button type="button" onclick="document.getElementById('ck').style.display='none'" style="background:#333;color:#fff;border:none;border-radius:50%;width:28px;height:28px;cursor:pointer">✕</button>
</div>

<div class="app">
  <div class="top">
    <span class="logo">LIKODOPT</span>
    <span style="font-size:0.8rem;color:#00e676">● В сети</span>
  </div>

  <div class="modes">
    <button type="button" class="mbtn on" id="ms" onclick="setM('solo')">👤 Соло (1 на 1)</button>
    <button type="button" class="mbtn" id="mg" onclick="setM('group')">👥 Групповой (до 6)</button>
  </div>

  <div class="box">
    <div id="ico" style="font-size:2rem;margin-bottom:8px">🎙️</div>
    <div class="grid6" id="g6"></div>
    <div id="t1" style="font-weight:700;margin-bottom:4px">Режим: Соло (1 на 1)</div>
    <div id="t2" style="font-size:0.82rem;color:#94a3b8">Нажмите «Найти / Далее»</div>
  </div>

  <div class="chat">
    <div id="msgs"></div>
    <form onsubmit="sendMsg(event)">
      <input id="inp" placeholder="Сообщение..." disabled>
      <button id="bs" disabled style="background:none;border:none;color:#00e676;padding:0 15px;font-weight:bold;cursor:pointer">➤</button>
    </form>
  </div>

  <div class="btns">
    <button type="button" class="btn" id="b1" onclick="goFind()">Найти / Далее</button>
    <button type="button" class="btn" id="b2" onclick="goStop(true)" disabled>Стоп</button>
    <button type="button" class="btn" id="b3" onclick="goMute()">Выключить микрофон</button>
  </div>
  <div id="auds"></div>
</div>

<script>
const URL_SIG = 'https://ntfy.sh';
const me = 'u_' + Math.random().toString(36).slice(2, 9);
const myName = 'Участник #' + Math.floor(100 + Math.random() * 899);

let mode = 'solo', st = 'home', pid = null, mic = null, mute = false, tmr = null, srch = null, sec = 0;
const peers = {}, grp = {}, seen = new Set();

function setM(m) {
  if (st !== 'home') goStop(false);
  mode = m;
  document.getElementById('ms').className = m === 'solo' ? 'mbtn on' : 'mbtn';
  document.getElementById('mg').className = m === 'group' ? 'mbtn on' : 'mbtn';
  document.getElementById('ico').style.display = 'block';
  document.getElementById('ico').textContent = m === 'solo' ? '🎙️' : '👥';
  document.getElementById('g6').style.display = 'none';
  document.getElementById('t1').textContent = m === 'solo' ? 'Режим: Соло (1 на 1)' : 'Режим: Групповой (до 6)';
  document.getElementById('t2').textContent = 'Нажмите «Найти / Далее»';
}

function log(t, c) {
  const d = document.createElement('div');
  d.className = 'm ' + (c || 'sys');
  d.textContent = t;
  const box = document.getElementById('msgs');
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function draw6() {
  const g = document.getElementById('g6');
  g.innerHTML = '';
  const ids = Object.keys(grp);
  for (let i = 0; i < 6; i++) {
    const s = document.createElement('div');
    if (ids[i]) {
      s.className = 'seat busy';
      s.textContent = ids[i] === me ? '🎙️ Вы' : '🎧 ' + grp[ids[i]];
    } else {
      s.className = 'seat';
      s.textContent = '➕ Свободно';
    }
    g.appendChild(s);
  }
  document.getElementById('t1').textContent = 'Комната (' + ids.length + '/6)';
}

function post(data) {
  const id = me + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
  fetch(URL_SIG, { method: 'POST', body: JSON.stringify({ id, f: me, name: myName, t: Date.now(), ...data }) }).catch(() => {});
}

function goFind() {
  goStop(false);
  document.getElementById('b2').disabled = false;
  document.getElementById('msgs').innerHTML = '';
  clearInterval(tmr); sec = 0;

  if (!mic && navigator.mediaDevices) {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(s => {
      mic = s;
      if (mute) mic.getAudioTracks().forEach(tr => tr.enabled = false);
    }).catch(() => log('Микрофон отключен — работает чат'));
  }

  if (mode === 'solo') {
    st = 'search';
    document.getElementById('ico').textContent = '🔍';
    document.getElementById('t1').textContent = 'Поиск собеседника...';
    document.getElementById('t2').textContent = 'Время поиска: 00:00';
    log('Ищем собеседника (1 на 1)...');
    tmr = setInterval(() => {
      sec++;
      document.getElementById('t2').textContent = 'Время поиска: ' + String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0');
    }, 1000);
    post({ tp: 'seek1' });
    srch = setInterval(() => { if (st === 'search') post({ tp: 'seek1' }); }, 1500);
  } else {
    st = 'group';
    document.getElementById('ico').style.display = 'none';
    document.getElementById('g6').style.display = 'grid';
    document.getElementById('inp').disabled = false;
    document.getElementById('bs').disabled = false;
    grp[me] = myName;
    draw6();
    log('Вы вошли в групповую комнату (до 6 мест)');
    tmr = setInterval(() => {
      sec++;
      document.getElementById('t2').textContent = 'В комнате: ' + String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0');
    }, 1000);
    post({ tp: 'seek6' });
    srch = setInterval(() => { if (st === 'group' && Object.keys(grp).length < 6) post({ tp: 'seek6' }); }, 2000);
  }
}

function goStop(ui) {
  clearInterval(srch); clearInterval(tmr);
  if (pid) post({ to: pid, tp: 'bye' });
  if (st === 'group') Object.keys(grp).forEach(u => { if (u !== me) post({ to: u, tp: 'bye6' }); });
  Object.keys(peers).forEach(u => { try { peers[u].close(); } catch(e) {} delete peers[u]; });
  for (const k in grp) delete grp[k];
  pid = null; st = 'home';
  document.getElementById('inp').disabled = true;
  document.getElementById('bs').disabled = true;
  if (ui) {
    document.getElementById('b2').disabled = true;
    setM(mode);
    document.getElementById('t1').textContent = 'Поиск остановлен';
    log('Вы вышли из комнаты');
  }
}

function goMute() {
  mute = !mute;
  if (mic) mic.getAudioTracks().forEach(tr => tr.enabled = !mute);
  document.getElementById('b3').textContent = mute ? 'Включить микрофон' : 'Выключить микрофон';
}

function sendMsg(e) {
  e.preventDefault();
  const inp = document.getElementById('inp');
  const v = inp.value.trim();
  if (!v) return;
  if (st === 'call' && pid) { log(v, 'me'); post({ to: pid, tp: 'txt', v }); inp.value = ''; }
  else if (st === 'group') { log(v, 'me'); Object.keys(grp).forEach(u => { if (u !== me) post({ to: u, tp: 'gtxt', v }); }); inp.value = ''; }
}
