<div class="cookie-banner" id="cookieBanner">
    <div class="cookie-text">🍪 Мы используем ваши файлы <b>Cookie</b> для улучшения работы сайта.</div>
    <button type="button" class="cookie-close-btn" id="btnCloseCookie">✕</button>
</div>

<script>
    const $ = id => document.getElementById(id);
    const CHANNEL = 'https://ntfy.sh';
    const myId = 'u_' + Math.random().toString(36).slice(2, 10);

    let partnerId = null;
    let state = 'home';
    let localStream = null;
    let pc = null;
    let isMuted = false;
    let timerInt = null;
    let searchInt = null;
    let sec = 0;
    const seen = new Set();

    if (localStorage.getItem('likodopt_ck') === '1') {
        $('cookieBanner').classList.add('hidden');
    }
    $('btnCloseCookie').onclick = function() {
        localStorage.setItem('likodopt_ck', '1');
        $('cookieBanner').classList.add('hidden');
    };

    function switchScreen(name) {
        clearInterval(timerInt);
        sec = 0;
        $('screenHome').classList.toggle('active', name === 'home');
        $('screenSearch').classList.toggle('active', name === 'search');
        $('screenCall').classList.toggle('active', name === 'call');

        if (name === 'search' || name === 'call') {
            const el = name === 'search' ? $('searchTimer') : $('callTimer');
            el.textContent = '00:00';
            timerInt = setInterval(() => {
                sec++;
                el.textContent = String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
            }, 1000);
        }
    }

    function addMsg(text, type = 'sys') {
        const d = document.createElement('div');
        d.className = 'msg ' + type;
        d.textContent = text;
        $('messages').appendChild(d);
        $('messages').scrollTop = $('messages').scrollHeight;
    }

    function setChat(on) {
        $('msgInput').disabled = !on;
        $('btnSend').disabled = !on;
        if (!on) $('msgInput').value = '';
    }

    function sendSig(data) {
        const mid = myId + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        fetch(CHANNEL, {
            method: 'POST',
            body: JSON.stringify({ mid, from: myId, ts: Date.now(), ...data })
        }).catch(() => {});
    }

    $('btnNext').onclick = function() {
        stopAll(false);
        state = 'search';
        $('btnStop').disabled = false;
        $('messages').innerHTML = '';
        switchScreen('search');
        addMsg('Вы вошли в очередь поиска собеседника...');

        if (!localStream && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(s => {
                    localStream = s;
                    $('btnMute').disabled = false;
                })
                .catch(() => addMsg('Микрофон недоступен — работает текстовый чат'));
        }

        sendSig({ type: 'seek' });
        searchInt = setInterval(() => {
            if (state === 'search') sendSig({ type: 'seek' });
        }, 1500);
    };

    $('btnStop').onclick = function() {
        stopAll(true);
    };

    function stopAll(showStop) {
        clearInterval(searchInt);
        if (partnerId) sendSig({ to: partnerId, type: 'bye' });
        partnerId = null;
        state = 'home';
        setChat(false);
        if (pc) {
            try { pc.close(); } catch (e) {}
            pc = null;
        }
        if (showStop) {
            $('btnStop').disabled = true;
            $('homeTitle').textContent = 'Поиск остановлен';
            switchScreen('home');
            addMsg('Вы вышли из очереди');
        }
    }

    $('btnMute').onclick = function() {
        if (!localStream) return;
        isMuted = !isMuted;
        localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
        this.textContent = isMuted ? 'Включить микрофон' : 'Выключить микрофон';
        this.classList.toggle('muted', isMuted);
    };

    $('chatForm').onsubmit = function(e) {
        e.preventDefault();
        const txt = $('msgInput').value.trim();
        if (!txt || !partnerId) return;
        addMsg(txt, 'me');
        sendSig({ to: partnerId, type: 'chat', text: txt });
        $('msgInput').value = '';
    };

    async function startCall(init) {
        state = 'call';
        switchScreen('call');
        setChat(true);
        $('messages').innerHTML = '';
        addMsg('Собеседник найден! Вы в комнате общения 👋');

        pc = new RTCPeerConnection({
            iceServers: [
                { urls: 'stun:://google.com' },
                { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
            ]
        });

        if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

        pc.ontrack = e => {
            $('remoteAudio').srcObject = new MediaStream([e.track]);
            $('remoteAudio').play().catch(() => {});
        };

        pc.onicecandidate = e => {
            if (e.candidate && partnerId) sendSig({ to: partnerId, type: 'cand', cand: e.candidate });
        };

        if (init) {
            const off = await pc.createOffer();
            await pc.setLocalDescription(off);
            sendSig({ to: partnerId, type: 'offer', offer: off });
        }
    }

    async function poll() {
        try {
            const res = await fetch(CHANNEL + '/json?poll=1&since=12s');
            if (res.ok) {
                const lines = (await res.text()).trim().split('\n');
                for (const l of lines) {
                    if (!l) continue;
                    const w = JSON.parse(l);
                    if (!w.message) continue;
                    const m = JSON.parse(w.message);
                    if (!m || m.from === myId || seen.has(m.mid) || Date.now() - m.ts > 15000) continue;
                    seen.add(m.mid);

                    if (m.type === 'seek' && state === 'search' && myId > m.from) {
                        state = 'conn';
                        partnerId = m.from;
                        clearInterval(searchInt);
                        sendSig({ to: partnerId, type: 'accept' });
                        startCall(true);
                    } else if (m.to === myId && m.type === 'accept' && state === 'search') {
                        state = 'conn';
                        partnerId = m.from;
                        clearInterval(searchInt);
                        startCall(false);
                    } else if (m.to === myId && m.from === partnerId) {
                        if (m.type === 'offer' && pc) {
                            await pc.setRemoteDescription(new RTCSessionDescription(m.offer));
                            const ans = await pc.createAnswer();
                            await pc.setLocalDescription(ans);
                            sendSig({ to: partnerId, type: 'answer', answer: ans });
                        } else if (m.type === 'answer' && pc) {
                            await pc.setRemoteDescription(new RTCSessionDescription(m.answer));
                        } else if (m.type === 'cand' && pc) {
                            try { await pc.addIceCandidate(new RTCIceCandidate(m.cand)); } catch (e) {}
                        } else if (m.type === 'chat') {
                            addMsg(m.text, 'partner');
                        } else if (m.type === 'bye') {
                            stopAll(true);
                            $('homeTitle').textContent = 'Собеседник отключился';
                        }
                    }
                }
            }
        } catch (e) {}
        setTimeout(poll, 1000);
    }

    poll();
</script>
</body>
</html>
