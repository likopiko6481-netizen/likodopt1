<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>LIKODOPT — Голосовая и текстовая чат-рулетка</title>
    <style>
        :root {
            --bg-dark: #0b0d12;
            --card-bg: rgba(20, 23, 31, 0.94);
            --panel-bg: rgba(14, 16, 22, 0.9);
            --border-color: #262b38;
            --accent: #00e676;
            --accent-hover: #00c853;
            --accent-glow: rgba(0, 230, 118, 0.35);
            --danger: #ff5252;
            --warning: #ff9800;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: url('./bg.png'), url('./bg.jpg');
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .app-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            padding: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            z-index: 10;
        }

        /* Шапка приложения */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            font-size: 1.55rem;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: 1.2px;
        }

        .stats-pill {
            background: #1e2330;
            border: 1px solid #2e3548;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .status-badge {
            background: #1e2330;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 7px;
            border: 1px solid #2e3548;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }

        /* Основной блок с 3 экранами */
        .stage-box {
            background: var(--panel-bg);
            border-radius: 18px;
            padding: 24px 16px;
            border: 1px solid var(--border-color);
            min-height: 210px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            animation: screenFade 0.25s ease-out;
        }

        .screen.active {
            display: flex;
        }

        @keyframes screenFade {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Экран 1: Главный */
        .avatar-circle {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: #1e2330;
            border: 2px solid #2e3548;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin-bottom: 14px;
            transition: all 0.2s ease;
        }

        .stage-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .stage-subtitle {
            font-size: 0.86rem;
            color: var(--text-muted);
            margin-bottom: 14px;
            max-width: 340px;
            line-height: 1.4;
        }

        .tags-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }

        .tag-btn {
            background: #1e2330;
            border: 1px solid #2e3548;
            color: var(--text-muted);
            padding: 5px 11px;
            border-radius: 14px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .tag-btn.selected {
            background: rgba(0, 230, 118, 0.15);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Экран 2: Поиск в очереди */
        .radar-ring {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            background: rgba(0, 230, 118, 0.1);
            border: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.1rem;
            margin-bottom: 14px;
            position: relative;
            animation: radarPulse 1.6s infinite ease-out;
        }

        @keyframes radarPulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.65); }
            100% { box-shadow: 0 0 0 22px rgba(0, 230, 118, 0); }
        }

        .timer-badge {
            background: #1e2330;
            border: 1px solid #333b50;
            padding: 6px 14px;
            border-radius: 14px;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
        }

        /* Экран 3: Собеседник найден */
        .partner-avatar {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: #163326;
            border: 3px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.3rem;
            margin-bottom: 12px;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .call-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
        }

        .live-indicator {
            background: rgba(0, 230, 118, 0.15);
            border: 1px solid rgba(0, 230, 118, 0.4);
            color: var(--accent);
            padding: 5px 12px;
            border-radius: 14px;
            font-size: 0.84rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .mic-level-bar {
            width: 90px;
            height: 6px;
            background: #1e2330;
            border-radius: 4px;
            overflow: hidden;
        }

        .mic-level-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.08s linear;
        }

        /* Чат и быстрые реакции */
        .chat-wrapper {
            background: var(--panel-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 195px;
            overflow: hidden;
        }

        #messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.9rem;
        }

        .msg {
            padding: 8px 13px;
            border-radius: 12px;
            max-width: 82%;
            word-wrap: break-word;
            line-height: 1.35;
        }

        .msg.me {
            background: var(--accent);
            color: #000;
            align-self: flex-end;
            font-weight: 600;
            border-bottom-right-radius: 4px;
        }

        .msg.partner {
            background: #232836;
            color: #fff;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .msg.sys {
            background: transparent;
            color: var(--text-muted);
            align-self: center;
            font-size: 0.8rem;
            text-align: center;
            padding: 4px 8px;
        }

        .typing-hint {
            font-size: 0.76rem;
            color: var(--accent);
            padding: 0 12px 4px;
            height: 18px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .typing-hint.visible {
            opacity: 1;
        }

        .quick-reactions {
            display: flex;
            gap: 6px;
            padding: 6px 10px;
            border-top: 1px solid #1e222d;
            background: rgba(18, 21, 28, 0.6);
        }

        .react-btn {
            background: #1e2330;
            border: 1px solid #2c3345;
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 0.95rem;
            cursor: pointer;
transition: transform 0.1s;
}
.react-btn:active {
transform: scale(0.9);
}
.react-btn:disabled {
opacity: 0.35;
cursor: not-allowed;
}
.chat-form {
display: flex;
border-top: 1px solid var(--border-color);
background: #12151c;
}
.chat-form input {
flex: 1;
background: transparent;
border: none;
padding: 12px 14px;
color: #fff;
outline: none;
font-size: 0.95rem;
}
.chat-form button {
background: transparent;
border: none;
color: var(--accent);
font-weight: 800;
padding: 0 18px;
font-size: 1.2rem;
cursor: pointer;
}
.chat-form button:disabled {
color: #475569;
cursor: not-allowed;
}
/* Панель кнопок управления */
.controls-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
}
.btn {
padding: 15px 12px;
border: none;
border-radius: 14px;
font-size: 0.98rem;
font-weight: 700;
cursor: pointer;
transition: transform 0.1s ease, opacity 0.2s ease, background 0.2s ease;
display: flex;
align-items: center;
justify-content: center;
gap: 6px;
}
.btn:active:not(:disabled) {
transform: scale(0.97);
}
.btn:disabled {
opacity: 0.4;
cursor: not-allowed;
}
#btnNext {
background: var(--accent);
color: #000;
}
#btnNext:hover:not(:disabled) {
background: var(--accent-hover);
}
#btnStop {
background: var(--danger);
color: #fff;
}
#btnMute {
background: #232836;
color: #fff;
border: 1px solid #32394d;
}
#btnMute.muted {
background: var(--warning);
color: #000;
border-color: var(--warning);
}
#btnSound {
background: #232836;
color: #fff;
border: 1px solid #32394d;
}
/* Плашка Cookie */
.cookie-banner {
position: fixed;
bottom: 18px;
left: 50%;
transform: translateX(-50%);
width: calc(100% - 32px);
max-width: 480px;
background: rgba(20, 23, 31, 0.98);
border: 1px solid var(--accent);
border-radius: 16px;
padding: 12px 16px;
display: flex;
align-items: center;
justify-content: space-between;
gap: 12px;
z-index: 9999;
box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85);
}
.cookie-banner.hidden {
display: none !important;
}
.cookie-text {
font-size: 0.84rem;
color: #e2e8f0;
line-height: 1.4;
}
.cookie-text b {
color: var(--accent);
}
.cookie-close-btn {
background: #232836;
color: #fff;
border: 1px solid #363e54;
border-radius: 50%;
width: 34px;
height: 34px;
min-width: 34px;
font-size: 1rem;
font-weight: 700;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
}
.cookie-close-btn:hover {
background: var(--danger);
border-color: var(--danger);
}
