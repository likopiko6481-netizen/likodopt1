<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Likodopt</title>
<style>
body{background:#0f1115 url('./bg.png') center/cover fixed;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:15px}
.app{background:rgba(24,27,34,.95);width:100%;max-width:400px;border-radius:20px;padding:20px;border:1px solid #333;text-align:center}
.logo{color:#00e676;font-size:1.5rem;font-weight:900;margin-bottom:15px;display:flex;justify-content:space-between}
.screen{background:#12141a;padding:25px 15px;border-radius:15px;margin-bottom:15px}
.btn{width:100%;padding:15px;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:8px}
.green{background:#00e676;color:#000}
.red{background:#ff5252;color:#fff}
.gray{background:#262b38;color:#fff}
.ck{position:fixed;bottom:15px;left:15px;right:15px;max-width:400px;margin:auto;background:#181b22;border:1px solid #00e676;padding:12px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;font-size:.85rem}
</style>
</head>
<body>
<div class="app">
  <div class="logo"><span>LIKODOPT</span><span style="font-size:.8rem;align-self:center">● В сети</span></div>
  <div class="screen">
    <div id="ico" style="font-size:2.5rem;margin-bottom:10px">🎙️</div>
    <div id="txt" style="font-size:1.1rem;font-weight:700">Нажмите «Найти»</div>
  </div>
  <button class="btn green" onclick="start()">Найти / Далее</button>
  <button class="btn red" onclick="stop()">Стоп</button>
  <button class="btn gray" id="mBtn" onclick="mute()">Микрофон: ВКЛ</button>
</div>
<div class="ck" id="ck">
  <span>🍪 Мы используем ваши файлы Cookie</span>
  <button onclick="document.getElementById('ck').style.display='none'" style="background:#333;color:#fff;border:none;border-radius:50%;width:26px;height:26px">✕</button>
</div>
<script>
let t=null, s=0, m=false;
function start(){
  clearInterval(t); s=0;
  document.getElementById('ico').textContent='🔍';
  document.getElementById('txt').textContent='В очереди: 00:00';
  t=setInterval(()=>{
    s++;
    let min=String(Math.floor(s/60)).padStart(2,'0'), sec=String(s%60).padStart(2,'0');
    document.getElementById('txt').textContent='В очереди: '+min+':'+sec;
  },1000);
}
function stop(){
  clearInterval(t);
  document.getElementById('ico').textContent='🎙️';
  document.getElementById('txt').textContent='Поиск остановлен';
}
function mute(){
  m=!m;
  document.getElementById('mBtn').textContent=m?'Микрофон: ВЫКЛ':'Микрофон: ВКЛ';
}
</script>
</body>
</html>
