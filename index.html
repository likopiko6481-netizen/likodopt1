<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Likodopt — Голосовая чат-рулетка</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: url('./bg.png') no-repeat center center fixed,
                        url('./bg.jpg') no-repeat center center fixed,
                        #0f1115;
            background-size: cover;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .app {
            background: rgba(24, 27, 34, 0.88);
            backdrop-filter: blur(8px);
            width: 100%;
            max-width: 460px;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            border: 1px solid #262a35;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #00e676;
            letter-spacing: 1px;
        }
        .online-badge {
            background: #232834;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #a0aab8;
            display: flex;
            align-items: center;
        }
        .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00e676;
            border-radius: 50%;
            margin-right: 6px;
        }
        .voice-box {
            background: rgba(18, 20, 26, 0.8);
            border-radius: 16px;
            padding: 25px 15px;
            text-align: center;
            margin-bottom: 15px;
            border: 1px solid #222630;
        }
        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #232834;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            transition: box-shadow 0.15s ease;
        }
        .avatar.speaking {
            box-shadow: 0 0 0 6px rgba(0, 230, 118, 0.35);
            background: #1c382c;
        }
        #status {
            font-size: 1rem;
            color: #cfd8e3;
            font-weight: 500;
        }
        .chat-box {
            background: rgba(18, 20, 26, 0.8);
            border-radius: 14px;
            height: 180px;
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
            border: 1px solid #222630;
            overflow: hidden;
        }
        #messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .msg { padding: 8px 12px; border-radius: 10px; max-width: 82%; word-wrap: break-word; }
        .msg.me { background: #00e676; color: #000; align-self: flex-end; font-weight: 500; }
        .msg.partner { background: #262b38; color: #fff; align-self: flex-start; }
        .msg.sys { background: transparent; color: #788292; align-self: center; font-size: 0.8rem; text-align: center; }
        .chat-input {
            display: flex;
            border-top: 1px solid #222630;
        }
        .chat-input input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }
        .chat-input button {
            background: transparent;
            border: none;
            color: #00e676;
            font-weight: bold;
            padding: 0 16px;
            cursor: pointer;
        }
        .chat-input button:disabled { color: #555; cursor: not-allowed; }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn {
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        #btnNext { background: #00e676; color: #000; }
        #btnStop { background: #ff5252; color: #fff; }
        #btnMute {
            grid-column: span 2;
            background: #262b38;
            color: #fff;
            font-weight: 600;
        }
        #btnMute.muted { background: #ff9800; color: #000; }

        .cookie-banner {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 30px);
            max-width: 460px;
            background: rgba(24, 27, 34, 0.96);
            border: 1px solid rgba(0, 230, 118, 0.35);
            border-radius: 16px;
            padding: 14px 16px;
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8);
            z-index: 999;
        }
        .cookie-banner.show { display: flex; }
        .cookie-text { font-size: 0.88rem; color: #e6ecf5; line-height: 1.4; }
        .cookie-text span { color: #00e676; font-weight: 700; }
        .cookie-close {
            background: #262b38;
            color: #a0aab8;
            border: 1px solid #353b4d;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            min-width: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <div class="logo">LIKODOPT</div>
        <div class="online-badge"><span class="online-dot"></span>Онлайн: В сети</div>
    </div>

    <div class="voice-box">
        <div class="avatar" id="partnerAvatar">🎙️</div>
        <div id="status">Нажмите «Найти / Далее»</div>
    </div>

    <div class="chat-box">
        <div id="messages"></div>
        <form class="chat-input" id="chatForm">
            <input type="text" id="msgInput" placeholder="Написать сообщение..." disabled autocomplete="off">
            <button type="submit" id="btnSend" disabled>➤</button>
        </form>
    </div>

    <div class="controls">
        <button class="btn" id="btnNext">Найти / Далее</button>
        <button class="btn" id="btnStop" disabled>Стоп</button>
        <button class="btn" id="btnMute" disabled>Выключить микрофон</button>
    </div>

    <audio id="remoteAudio" autoplay playsinline></audio>
</div>

<div class="cookie-banner" id="cookieBanner">
    <div class="cookie-text">🍪 Мы используем ваши файлы <span>Cookie</span> для улучшения работы сайта.</div>
    <button class="cookie-close" id="closeCookieBtn" title="Закрыть">✕</button>
</div>

<script>
    // Cookie
    function setCookie(name, value, days) {
        const d = new Date();
        d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
        document.cookie = name + "=" + encodeURIComponent(value) + ";expires=" + d.toUTCString() + ";path=/;SameSite=Lax";
    }
    function getCookie(name) {
        const prefix = name + "=";
        const parts = document.cookie.split(';');
        for (let i = 0; i < parts.length; i++) {
            let c = parts[i].trim();
            if (c.indexOf(prefix) === 0) return decodeURIComponent(c.substring(prefix.length));
        }
        return null;
    }
    const cookieBanner = document.getElementById('cookieBanner');
    if (!getCookie('likodopt_cookie_closed')) cookieBanner.classList.add('show');
    document.getElementById('closeCookieBtn').addEventListener('click', () => {
        setCookie('likodopt_cookie_closed', '1', 30);
        cookieBanner.classList.remove('show');
    });

    // Элементы
    const statusEl = document.getElementById('status');
    const partnerAvatar = document.getElementById('partnerAvatar');
    const messagesEl = document.getElementById('messages');
    const chatForm = document.getElementById('chatForm');
    const msgInput = document.getElementById('msgInput');
    const btnSend = document.getElementById('btnSend');
    const btnNext = document.getElementById('btnNext');
    const btnStop = document.getElementById('btnStop');
    const btnMute = document.getElementById('btnMute');
    const remoteAudio = document.getElementById('remoteAudio');

    // Обмен сигналами через обычный HTTPS (порт 443, ntfy.sh)
    const TOPIC = 'likodopt_signal_channel_ru_991';
    const myId = 'u_' + Math.random().toString(36).slice(2, 10);

    let partnerId = null;
    let state = 'idle';
    let localStream = null;
    let pc = null;
    let isMuted = false;
    let searchTimer = null;
    let eventSource = null;

    const rtcConfig = {
        iceServers: [
            { urls: 'stun:://google.com' },
            { urls: 'stun:://google.com' },
            {
                urls: 'turn:openrelay.metered.ca:80',
                username: 'openrelayproject',
                credential: 'openrelayproject'
            },
            {
                urls: 'turn:openrelay.metered.ca:443',
                username: 'openrelayproject',
                credential: 'openrelayproject'
            }
        ]
    };

    function addMessage(text, type) {
        const div = document.createElement('div');
        div.className = 'msg ' + type;
div.textContent = text;
messagesEl.appendChild(div);
messagesEl.scrollTop = messagesEl.scrollHeight;
}
function setChatEnabled(enabled) {
msgInput.disabled = !enabled;
btnSend.disabled = !enabled;
if (!enabled) msgInput.value = '';
}
async function sendSignal(payload) {
try {
await fetch('ntfy.sh' + TOPIC, {
method: 'POST',
body: JSON.stringify({ from: myId, ...payload })
});
} catch (e) {}
}
function startListening() {
if (eventSource) eventSource.close();
eventSource = new EventSource('ntfy.sh' + TOPIC + '/sse');
eventSource.onmessage = async (ev) => {
let wrapper, data;
try {
wrapper = JSON.parse(ev.data);
if (!wrapper.message) return;
data = JSON.parse(wrapper.message);
} catch (e) { return; }
if (!data || data.from === myId) return;
if (data.type === 'seek' && state === 'searching') {
if (myId > data.from) {
startCallWith(data.from, true);
sendSignal({ to: data.from, type: 'accept' });
}
} else if (data.to === myId) {
if (data.type === 'accept' && state === 'searching') {
startCallWith(data.from, false);
} else if (data.from === partnerId) {
if (data.type === 'signal') await handleWebRTC(data.signal);
else if (data.type === 'chat') addMessage(data.text, 'partner');
else if (data.type === 'bye') {
closeCall();
statusEl.textContent = 'Собеседник отключился';
addMessage('Собеседник покинул чат. Нажмите «Далее»', 'sys');
}
}
}
};
}
startListening();
async function initAudio() {
if (!localStream) {
try {
localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
btnMute.disabled = false;
} catch (err) {
statusEl.textContent = 'Разрешите доступ к микрофону!';
addMessage('Ошибка: браузер заблокировал микрофон', 'sys');
throw err;
}
}
}
function closeCall() {
clearInterval(searchTimer);
if (partnerId) sendSignal({ to: partnerId, type: 'bye' });
partnerId = null;
state = 'idle';
partnerAvatar.classList.remove('speaking');
setChatEnabled(false);
if (pc) { try { pc.close(); } catch (e) {} pc = null; }
remoteAudio.srcObject = null;
}
async function startCallWith(target, isInitiator) {
clearInterval(searchTimer);
partnerId = target;
state = 'connected';
statusEl.textContent = 'Собеседник на связи!';
messagesEl.innerHTML = '';
addMessage('Соединение установлено. Поздоровайтесь!', 'sys');
partnerAvatar.classList.add('speaking');
setChatEnabled(true);
pc = new RTCPeerConnection(rtcConfig);
localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
pc.ontrack = (ev) => {
const stream = new MediaStream();
stream.addTrack(ev.track);
remoteAudio.srcObject = stream;
remoteAudio.play().catch(() => {});
};
pc.onicecandidate = (ev) => {
if (ev.candidate) sendSignal({ to: partnerId, type: 'signal', signal: { candidate: ev.candidate } });
};
if (isInitiator) {
const offer = await pc.createOffer();
await pc.setLocalDescription(offer);
sendSignal({ to: partnerId, type: 'signal', signal: { offer } });
}
}
async function handleWebRTC(sig) {
if (!pc) return;
if (sig.offer) {
await pc.setRemoteDescription(new RTCSessionDescription(sig.offer));
const answer = await pc.createAnswer();
await pc.setLocalDescription(answer);
sendSignal({ to: partnerId, type: 'signal', signal: { answer } });
} else if (sig.answer) {
await pc.setRemoteDescription(new RTCSessionDescription(sig.answer));
} else if (sig.candidate) {
await pc.addIceCandidate(new RTCIceCandidate(sig.candidate));
}
}
btnNext.addEventListener('click', async () => {
await initAudio();
closeCall();
state = 'searching';
btnStop.disabled = false;
messagesEl.innerHTML = '';
statusEl.textContent = 'Поиск собеседника...';
addMessage('Ожидание свободного собеседника...', 'sys');
sendSignal({ type: 'seek' });
searchTimer = setInterval(() => {
if (state === 'searching') sendSignal({ type: 'seek' });
}, 1800);
});
btnStop.addEventListener('click', () => {
closeCall();
btnStop.disabled = true;
statusEl.textContent = 'Поиск остановлен';
addMessage('Вы завершили диалог', 'sys');
});
btnMute.addEventListener('click', () => {
if (!localStream) return;
isMuted = !isMuted;
localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
btnMute.textContent = isMuted ? 'Включить микрофон' : 'Выключить микрофон';
btnMute.classList.toggle('muted', isMuted);
});
chatForm.addEventListener('submit', (e) => {
e.preventDefault();
const text = msgInput.value.trim();
if (!text || state !== 'connected' || !partnerId) return;
addMessage(text, 'me');
sendSignal({ to: partnerId, type: 'chat', text });
msgInput.value = '';
});
