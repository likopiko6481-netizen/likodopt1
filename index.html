<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Likodopt — Голосовая чат-рулетка</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: url('/bg') no-repeat center center fixed, #0f1115;
            background-size: cover;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .app {
            background: rgba(24, 27, 34, 0.92);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 440px;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.65);
            border: 1px solid #262a35;
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .logo { font-size: 1.5rem; font-weight: 800; color: #00e676; letter-spacing: 1px; }
        .online-badge { background: #232834; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; color: #a0aab8; display: flex; align-items: center; }
        .online-dot { width: 8px; height: 8px; background: #ff5252; border-radius: 50%; margin-right: 6px; }
        .online-dot.connected { background: #00e676; }

        .voice-box { background: rgba(18, 20, 26, 0.85); border-radius: 16px; padding: 24px 15px; text-align: center; margin-bottom: 15px; border: 1px solid #222630; }
        .avatar { width: 72px; height: 72px; border-radius: 50%; background: #232834; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 2rem; transition: 0.2s; }
        .avatar.active { box-shadow: 0 0 0 6px rgba(0, 230, 118, 0.3); background: #1c382c; }
        #status { font-size: 1rem; color: #cfd8e3; font-weight: 500; }

        .radar { position: relative; width: 72px; height: 72px; border-radius: 50%; background: rgba(0, 230, 118, 0.12); border: 2px solid #00e676; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 12px; }
        .radar::before { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid #00e676; animation: pulseRing 1.8s infinite ease-out; }
        @keyframes pulseRing { 0% { transform: scale(0.95); opacity: 0.8; } 100% { transform: scale(1.5); opacity: 0; } }
        .queue-timer { display: inline-block; background: #232834; color: #fff; padding: 4px 12px; border-radius: 12px; font-size: 0.85rem; margin-top: 8px; border: 1px solid #323846; }

        .chat-box { background: rgba(18, 20, 26, 0.85); border-radius: 14px; height: 185px; display: flex; flex-direction: column; margin-bottom: 15px; border: 1px solid #222630; overflow: hidden; }
        #messages { flex: 1; padding: 12px; overflow-y: auto; font-size: 0.9rem; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 10px; max-width: 82%; word-wrap: break-word; }
        .msg.me { background: #00e676; color: #000; align-self: flex-end; font-weight: 500; }
        .msg.partner { background: #262b38; color: #fff; align-self: flex-start; }
        .msg.sys { background: transparent; color: #788292; align-self: center; font-size: 0.8rem; text-align: center; }
        .chat-input { display: flex; border-top: 1px solid #222630; }
        .chat-input input { flex: 1; background: transparent; border: none; padding: 12px; color: #fff; outline: none; font-size: 0.9rem; }
        .chat-input button { background: transparent; border: none; color: #00e676; font-weight: bold; padding: 0 18px; font-size: 1.1rem; cursor: pointer; }
        .chat-input button:disabled { color: #555; }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 15px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.15s; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        #btnNext { background: #00e676; color: #000; }
        #btnStop { background: #ff5252; color: #fff; }
        #btnMute { grid-column: span 2; background: #262b38; color: #fff; font-weight: 600; }
        #btnMute.muted { background: #ff9800; color: #000; }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="logo">LIKODOPT</div>
        <div class="online-badge"><span class="online-dot" id="connDot"></span>Онлайн: <span id="onlineCount">1</span></div>
    </div>

    <div class="voice-box">
        <div id="idleView">
            <div class="avatar" id="avatarIcon">🎙️</div>
            <div id="status">Нажмите «Найти / Далее»</div>
        </div>
        <div id="queueView" style="display:none;">
            <div class="radar">🔍</div>
            <div style="font-weight:700;color:#00e676;">Ищем собеседника...</div>
            <div class="queue-timer">Поиск: <span id="timerText">00:00</span></div>
        </div>
    </div>

    <div class="chat-box">
        <div id="messages"></div>
        <form class="chat-input" id="chatForm">
            <input type="text" id="msgInput" placeholder="Написать сообщение..." disabled autocomplete="off">
            <button type="submit" id="btnSend" disabled>➤</button>
        </form>
    </div>

    <div class="controls">
        <button type="button" class="btn" id="btnNext">Найти / Далее</button>
        <button type="button" class="btn" id="btnStop" disabled>Стоп</button>
        <button type="button" class="btn" id="btnMute">Выключить микрофон</button>
    </div>

    <audio id="remoteAudio" autoplay playsinline></audio>
</div>

<script>
const myId = 'u_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
let localStream = null;
let pc = null;
let isMuted = false;
let timerInt = null;
let pendingIce = [];

const rtcConfig = {
    iceServers: [
        { urls: 'stun:://google.com' },
        { urls: 'stun:://google.com' }
    ]
};

const btnNext = document.getElementById('btnNext');
const btnStop = document.getElementById('btnStop');
const btnMute = document.getElementById('btnMute');
const msgInput = document.getElementById('msgInput');
const btnSend = document.getElementById('btnSend');
const messages = document.getElementById('messages');
const statusEl = document.getElementById('status');
const idleView = document.getElementById('idleView');
const queueView = document.getElementById('queueView');
const avatarIcon = document.getElementById('avatarIcon');
const remoteAudio = document.getElementById('remoteAudio');

function addMsg(text, cls) {
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text;
    messages.appendChild(d);
    messages.scrollTop = messages.scrollHeight;
}

function startSearchTimer() {
    clearInterval(timerInt);
    let sec = 0;
    document.getElementById('timerText').textContent = '00:00';
    timerInt = setInterval(() => {
        sec++;
        const m = String(Math.floor(sec / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        document.getElementById('timerText').textContent = m + ':' + s;
    }, 1000);
}

function setUIState(state) {
    clearInterval(timerInt);
    if (state === 'idle') {
        idleView.style.display = 'block';
        queueView.style.display = 'none';
        avatarIcon.classList.remove('active');
        btnStop.disabled = true;
        msgInput.disabled = true;
        btnSend.disabled = true;
    } else if (state === 'searching') {
        idleView.style.display = 'none';
        queueView.style.display = 'block';
        btnStop.disabled = false;
        msgInput.disabled = true;
        btnSend.disabled = true;
        startSearchTimer();
    } else if (state === 'connected') {
        idleView.style.display = 'block';
        queueView.style.display = 'none';
        avatarIcon.classList.add('active');
        statusEl.textContent = 'Собеседник на связи 🎧';
        btnStop.disabled = false;
        msgInput.disabled = false;
        btnSend.disabled = false;
    }
}

async function ensureMic() {
    if (localStream) return true;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        addMsg('⚠️ Откройте сайт по https:// для работы микрофона', 'sys');
        return false;
    }
    try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
        return true;
    } catch (e) {
        addMsg('⚠️ Доступ к микрофону запрещён (работает только чат)', 'sys');
        return false;
    }
}

function closeRTC() {
    if (pc) {
        pc.close();
        pc = null;
    }
    pendingIce = [];
    remoteAudio.srcObject = null;
}

async function createRTC(isInitiator) {
    closeRTC();
    pc = new RTCPeerConnection(rtcConfig);

    if (localStream) {
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
    }

    pc.onicecandidate = (e) => {
        if (e.candidate) {
            fetch('/api/signal', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: myId, signal: { candidate: e.candidate } })
            });
        }
    };

    pc.ontrack = (e) => {
        remoteAudio.srcObject = e.streams[0];
    };

    if (isInitiator) {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await fetch('/api/signal', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ id: myId, signal: { sdp: pc.localDescription } })
});
}
}
async function handleSignal(signal) {
if (!pc) return;
if (signal.sdp) {
await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
while (pendingIce.length > 0) {
await pc.addIceCandidate(new RTCIceCandidate(pendingIce.shift()));
}
if (signal.sdp.type === 'offer') {
const answer = await pc.createAnswer();
await pc.setLocalDescription(answer);
await fetch('/api/signal', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ id: myId, signal: { sdp: pc.localDescription } })
});
}
} else if (signal.candidate) {
if (pc.remoteDescription) {
await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
} else {
pendingIce.push(signal.candidate);
}
}
}
async function pollServer() {
try {
const res = await fetch('/api/poll', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ id: myId })
});
if (res.ok) {
document.getElementById('connDot').classList.add('connected');
const data = await res.json();
document.getElementById('onlineCount').textContent = data.online;
for (const ev of data.events) {
if (ev.type === 'matched') {
messages.innerHTML = '';
setUIState('connected');
addMsg('Собеседник найден! Можете говорить 👋', 'sys');
await createRTC(ev.initiator);
} else if (ev.type === 'signal') {
await handleSignal(ev.signal);
} else if (ev.type === 'msg') {
addMsg(ev.text, 'partner');
} else if (ev.type === 'partner_left') {
closeRTC();
setUIState('idle');
statusEl.textContent = 'Собеседник отключился';
addMsg('Собеседник покинул чат', 'sys');
}
}
}
} catch (e) {
document.getElementById('connDot').classList.remove('connected');
}
setTimeout(pollServer, 600);
}
pollServer();
btnNext.onclick = async () => {
await ensureMic();
closeRTC();
messages.innerHTML = '';
setUIState('searching');
addMsg('Поиск свободного собеседника...', 'sys');
await fetch('/api/find', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ id: myId })
});
};
btnStop.onclick = async () => {
closeRTC();
setUIState('idle');
statusEl.textContent = 'Поиск остановлен';
addMsg('Вы остановили общение', 'sys');
await fetch('/api/stop', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ id: myId })
});
};
btnMute.onclick = () => {
isMuted = !isMuted;
if (localStream) {
localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
}
btnMute.textContent = isMuted ? 'Включить микрофон' : 'Выключить микрофон';
btnMute.classList.toggle('muted', isMuted);
};
document.getElementById('chatForm').onsubmit = async (e) => {
e.preventDefault();
const text = msgInput.value.trim();
if (!text) return;
msgInput.value = '';
addMsg(text, 'me');
await fetch('/api/msg', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ id: myId, text })
});
};
