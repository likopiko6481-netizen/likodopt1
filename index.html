<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIKODOPT</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
  body { background: #0b0d12 url('./bg.png') center/cover no-repeat fixed; background-image: url('./bg.png'), url('./bg.jpg'), url('./bg.webp'); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
  .app { background: rgba(20, 23, 31, 0.95); width: 100%; max-width: 440px; border-radius: 22px; padding: 20px; border: 1px solid #2e3548; display: flex; flex-direction: column; gap: 12px; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .logo { font-size: 1.45rem; font-weight: 900; color: #00e676; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mbtn { padding: 11px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; background: #1e2330; color: #94a3b8; }
  .mbtn.on { background: #00e676; color: #000; }
  .box { background: #0e1016; border-radius: 16px; padding: 22px 15px; text-align: center; min-height: 185px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #262b38; }
  .scr { display: none; flex-direction: column; align-items: center; width: 100%; }
  .scr.on { display: flex; }
  .ava { width: 70px; height: 70px; border-radius: 50%; background: #1e2330; display: flex; align-items: center; justify-content: center; font-size: 1.9rem; margin-bottom: 10px; }
  .ava.radar { border: 2px solid #00e676; animation: pulse 1.4s infinite; }
  .ava.call { background: #163326; border: 2px solid #00e676; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.6); } 100% { box-shadow: 0 0 0 18px rgba(0, 230, 118, 0); } }
  .lobby { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 8px 0 10px; }
  .chip { background: #1a1f2b; border: 1px solid #00e676; padding: 4px 10px; border-radius: 14px; font-size: 0.78rem; }
  .grid6 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; margin-bottom: 10px; }
  .seat { background: #1a1f2b; border: 1px solid #2c3345; border-radius: 10px; padding: 8px 4px; font-size: 0.75rem; color: #64748b; }
  .seat.busy { background: #163326; border-color: #00e676; color: #fff; font-weight: 600; }
  .chat { background: #0e1016; border-radius: 14px; height: 140px; display: flex; flex-direction: column; border: 1px solid #262b38; overflow: hidden; }
  #msgs { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 0.88rem; }
  .m { padding: 6px 10px; border-radius: 10px; max-width: 82%; }
  .me { background: #00e676; color: #000; align-self: flex-end; font-weight: 600; }
  .he { background: #232836; align-self: flex-start; }
  .sys { color: #94a3b8; align-self: center; font-size: 0.78rem; }
  form { display: flex; border-top: 1px solid #262b38; }
  input { flex: 1; background: none; border: none; padding: 10px; color: #fff; outline: none; font-size: 16px; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { padding: 14px; border: none; border-radius: 12px; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #bNext { background: #00e676; color: #000; }
  #bStop { background: #ff5252; color: #fff; }
  #bMute { grid-column: span 2; background: #232836; color: #fff; }
  #bMute.on { background: #ff9800; color: #000; }
  .ck { position: fixed; top: 12px; left: 12px; right: 12px; max-width: 440px; margin: auto; background: #14171f; border: 1px solid #00e676; border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; z-index: 9999; font-size: 0.82rem; }
</style>
</head>
<body>

<div class="ck" id="ckBox">
  <span>🍪 Мы используем файлы <b style="color:#00e676">Cookie</b> для работы сайта.</span>
  <button type="button" id="ckClose" style="background:#333;color:#fff;border:none;border-radius:50%;width:28px;height:28px;cursor:pointer">✕</button>
</div>

<div class="app">
  <div class="top">
    <span class="logo">LIKODOPT</span>
    <span id="netSt" style="font-size:0.8rem;color:#00e676">● В сети</span>
  </div>

  <div class="modes">
    <button type="button" class="mbtn on" id="mSolo">👤 Соло (1 на 1)</button>
    <button type="button" class="mbtn" id="mGroup">👥 Групповой (до 6)</button>
  </div>

  <div class="box">
    <div class="scr on" id="sHome">
      <div class="ava" id="hIco">🎙️</div>
      <div id="hTitle" style="font-weight:700;margin-bottom:4px">Режим: Соло (1 на 1)</div>
      <div style="font-size:0.82rem;color:#94a3b8">Нажмите «Найти / Далее»</div>
    </div>

    <div class="scr" id="sWait">
      <div class="ava radar">⏳</div>
      <div style="font-weight:700;color:#00e676;margin-bottom:4px">Комната ожидания</div>
      <div class="lobby" id="lobbyList"></div>
      <div id="tWait" style="font-size:0.85rem;color:#94a3b8">Время ожидания: 00:00</div>
    </div>

    <div class="scr" id="sCall">
      <div class="ava call">🎧</div>
      <div style="font-weight:700;margin-bottom:4px">Собеседник на связи!</div>
      <div id="tCall" style="font-size:0.85rem;color:#00e676">● Разговор: 00:00</div>
    </div>

    <div class="scr" id="sGroup">
      <div class="grid6" id="gGrid"></div>
      <div id="tGroup" style="font-size:0.85rem;color:#00e676">● Комната (1/6) • 00:00</div>
    </div>
  </div>

  <div class="chat">
    <div id="msgs"></div>
    <form id="cForm">
      <input id="inp" placeholder="Написать сообщение..." disabled>
      <button type="submit" id="bSend" disabled style="background:none;border:none;color:#00e676;padding:0 15px;font-weight:bold;cursor:pointer">➤</button>
    </form>
  </div>

  <div class="btns">
    <button type="button" class="btn" id="bNext">Найти / Далее</button>
    <button type="button" class="btn" id="bStop" disabled>Стоп</button>
    <button type="button" class="btn" id="bMute">Выключить микрофон</button>
  </div>
  <div id="auds"></div>
</div>

<script src="./script.js?v=3000"></script>
</body>
</html>
