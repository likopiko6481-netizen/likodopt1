<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>Likodopt</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#0f1115 url('./bg.png') center/cover fixed;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:15px}
.app{background:rgba(24,27,34,.95);width:100%;max-width:440px;border-radius:20px;padding:22px;border:1px solid #262a35}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo{font-size:1.5rem;font-weight:800;color:#00e676}
.badge{background:#232834;padding:6px 12px;border-radius:20px;font-size:.85rem;color:#a0aab8}
.box{background:#12141a;border-radius:16px;padding:22px 15px;text-align:center;margin-bottom:15px;border:1px solid #222630;min-height:150px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.view{display:none;flex-direction:column;align-items:center;width:100%}
.view.on{display:flex}
.ava{width:70px;height:70px;border-radius:50%;background:#232834;margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-size:2rem}
.ava.green{background:#1c382c;border:2px solid #00e676}
.chat{background:#12141a;border-radius:14px;height:160px;display:flex;flex-direction:column;margin-bottom:15px;border:1px solid #222630;overflow:hidden}
#msgs{flex:1;padding:12px;overflow-y:auto;font-size:.9rem;display:flex;flex-direction:column;gap:8px}
.m{padding:8px 12px;border-radius:10px;max-width:82%}
.m.me{background:#00e676;color:#000;align-self:flex-end}
.m.he{background:#262b38;align-self:flex-start}
.m.sys{color:#788292;align-self:center;font-size:.8rem}
.form{display:flex;border-top:1px solid #222630}
.form input{flex:1;background:none;border:none;padding:12px;color:#fff;outline:none;font-size:16px}
.form button{background:none;border:none;color:#00e676;font-weight:bold;padding:0 18px;font-size:1.2rem}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:15px 10px;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.4}
#bNext{background:#00e676;color:#000}
#bStop{background:#ff5252;color:#fff}
#bMute{grid-column:span 2;background:#262b38;color:#fff}
.ck{position:fixed;top:12px;left:15px;right:15px;max-width:440px;margin:auto;background:#181b22;border:1px solid #00e676;border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;z-index:999;font-size:.82rem}
.ck button{background:#262b38;color:#fff;border:none;border-radius:50%;width:30px;height:30px}
</style>
</head>
<body>
<div class="ck" id="ck"><span>🍪 Мы используем ваши файлы <b style="color:#00e676">Cookie</b></span><button type="button" id="ckX">✕</button></div>
<div class="app">
  <div class="top"><div class="logo">LIKODOPT</div><div class="badge" id="net">● В сети</div></div>
  <div class="box">
    <div class="view on" id="vIdle"><div class="ava">🎙️</div><div id="stTxt" style="font-weight:700">Нажмите «Найти / Далее»</div></div>
    <div class="view" id="vQueue"><div class="ava">🔍</div><div style="color:#00e676;font-weight:700;margin-bottom:6px">Вы в очереди ожидания</div><div id="tQueue" style="font-size:.9rem;color:#a0aab8">Поиск: 00:00</div></div>
    <div class="view" id="vCall"><div class="ava green">🎧</div><div style="font-weight:700;margin-bottom:6px">Собеседник на связи</div><div id="tCall" style="font-size:.9rem;color:#00e676">● Разговор: 00:00</div></div>
  </div>
  <div class="chat"><div id="msgs"></div><form class="form" id="cForm"><input id="inp" placeholder="Сообщение..." disabled><button id="bSend" disabled>➤</button></form></div>
  <div class="btns"><button type="button" class="btn" id="bNext">Найти / Далее</button><button type="button" class="btn" id="bStop" disabled>Стоп</button><button type="button" class="btn" id="bMute" disabled>Выключить микрофон</button></div>
  <audio id="aud" autoplay playsinline></audio>
</div>
<script src="./app.js?v=1"></script>
</body>
</html>
