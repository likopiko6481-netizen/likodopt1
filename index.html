<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Likodopt</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:url('./bg.png') center/cover fixed,#0f1115;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:15px}
.app{background:rgba(24,27,34,.92);width:100%;max-width:420px;border-radius:20px;padding:20px;border:1px solid #262a35}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.logo{font-size:1.4rem;font-weight:800;color:#00e676}
.box{background:#12141a;border-radius:15px;padding:20px;text-align:center;margin-bottom:12px}
.chat{background:#12141a;border-radius:12px;height:150px;display:flex;flex-direction:column;margin-bottom:12px;overflow:hidden}
#msgs{flex:1;padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.m{padding:6px 10px;border-radius:8px;max-width:80%}
.me{background:#00e676;color:#000;align-self:flex-end}
.he{background:#262b38;align-self:flex-start}
.sys{color:#788292;align-self:center;font-size:.8rem}
form{display:flex;border-top:1px solid #222}
input{flex:1;background:none;border:none;padding:10px;color:#fff;outline:none}
button{cursor:pointer;border:none;font-weight:700;border-radius:10px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{padding:14px;font-size:1rem}
.btn:disabled{opacity:.4}
#b1{background:#00e676;color:#000}
#b2{background:#ff5252;color:#fff}
#b3{grid-column:span 2;background:#262b38;color:#fff}
.ck{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:92%;max-width:420px;background:#181b22;border:1px solid #00e676;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:.85rem}
</style>
</head>
<body>
<div class="app">
  <div class="top"><span class="logo">LIKODOPT</span><span id="net" style="font-size:.85rem;color:#00e676">● В сети</span></div>
  <div class="box"><div id="ico" style="font-size:2.2rem;margin-bottom:8px">🎙️</div><div id="st">Нажмите «Найти / Далее»</div></div>
  <div class="chat"><div id="msgs"></div><form id="f"><input id="i" placeholder="Сообщение..." disabled><button id="s" disabled style="background:none;color:#00e676;padding:0 15px">➤</button></form></div>
  <div class="btns"><button class="btn" id="b1">Найти / Далее</button><button class="btn" id="b2" disabled>Стоп</button><button class="btn" id="b3" disabled>Выключить микрофон</button></div>
  <audio id="a" autoplay playsinline></audio>
</div>
<div class="ck" id="ck"><span>🍪 Мы используем ваши файлы <b style="color:#00e676">Cookie</b> для улучшения работы сайта.</span><button onclick="this.parentElement.remove()" style="background:#262b38;color:#fff;width:28px;height:28px;border-radius:50%">✕</button></div>
<script>
const $=id=>document.getElementById(id);
const me='u'+Math.random().toString(36).slice(2,9);
let pid=null,st='idle',mic=null,pc=null,mute=false,loop=null,sec=0,tInt=null;
const seen=new Set();
const API='https://jsonblob.com';

const log=(t,k)=>{const e=document.createElement('div');e.className='m '+k;e.textContent=t;$('msgs').appendChild(e);$('msgs').scrollTop=9999};
const ui=(ic,tx,on)=>{$('ico').textContent=ic;$('st').textContent=tx;$('i').disabled=!on;$('s').disabled=!on};

function timer(on){
  clearInterval(tInt);sec=0;
  if(on)tInt=setInterval(()=>{sec++;$('st').textContent=(st==='search'?'В очереди: ':'Собеседник на связи: ')+String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')},1000);
}

async function sync(fn){
  try{
    const r=await fetch(API);
    let d=r.ok?await r.json():{q:[],m:[]};
    if(!d.q)d.q=[];if(!d.m)d.m=[];
    const now=Date.now();
    d.q=d.q.filter(x=>now-x.t<9000);
    d.m=d.m.filter(x=>now-x.t<15000);
    const upd=await fn(d,now);
    if(upd)await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
  }catch(e){}
}

function stop(msg){
  clearInterval(loop);timer(false);
  if(pid)sync(d=>{d.m.push({id:me+Date.now(),f:me,to:pid,tp:'bye',t:Date.now()});return true});
  pid=null;st='idle';if(pc){pc.close();pc=null}
  if(msg){$('b2').disabled=true;ui('🎙️',msg,false)}
}

async function call(init){
  st='call';timer(true);$('msgs').innerHTML='';ui('🎧','Собеседник на связи: 00:00',true);log('Собеседник найден!','sys');
  pc=new RTCPeerConnection({iceServers:[{urls:'stun:://google.com'},{urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'}]});
  if(mic)mic.getTracks().forEach(t=>pc.addTrack(t,mic));
  pc.ontrack=e=>{$('a').srcObject=new MediaStream([e.track]);$('a').play().catch(()=>{})};
  pc.onicecandidate=e=>{if(e.candidate&&pid)sync(d=>{d.m.push({id:me+Math.random(),f:me,to:pid,tp:'c',c:e.candidate,t:Date.now()});return true})};
  if(init){const o=await pc.createOffer();await pc.setLocalDescription(o);sync(d=>{d.m.push({id:me+Math.random(),f:me,to:pid,tp:'o',o,t:Date.now()});return true})}
}

$('b1').onclick=()=>{
  stop(false);st='search';$('b2').disabled=false;$('msgs').innerHTML='';ui('🔍','В очереди: 00:00',false);timer(true);log('Ищем собеседника...','sys');
  if(!mic&&navigator.mediaDevices)navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{mic=s;$('b3').disabled=false}).catch(()=>{});
  const step=()=>sync(async(d,now)=>{
    const other=d.q.find(x=>x.id!==me);
    if(other&&me>other.id){
      pid=other.id;d.q=d.q.filter(x=>x.id!==me&&x.id!==pid);
      d.m.push({id:me+now,f:me,to:pid,tp:'ok',t:now});
      clearInterval(loop);call(true);return true;
    }
    if(!d.q.some(x=>x.id===me)){d.q.push({id:me,t:now});return true}
    d.q.find(x=>x.id===me).t=now;return true;
  });
  step();loop=setInterval(step,1500);
};

$('b2').onclick=()=>stop('Поиск остановлен');
$('b3').onclick=()=>{if(!mic)return;mute=!mute;mic.getAudioTracks().forEach(t=>t.enabled=!mute);$('b3').textContent=mute?'Включить микрофон':'Выключить микрофон'};
$('f').onsubmit=e=>{e.preventDefault();const v=$('i').value.trim();if(!v||!pid)return;log(v,'me');$('i').value='';sync(d=>{d.m.push({id:me+Date.now(),f:me,to:pid,tp:'txt',v,t:Date.now()});return true})};

setInterval(()=>sync(async d=>{
  let ch=false;
  for(const m of d.m){
    if(m.to!==me||seen.has(m.id))continue;seen.add(m.id);ch=true;
    if(m.tp==='ok'&&st==='search'){pid=m.f;clearInterval(loop);call(false)}
    else if(m.f===pid){
      if(m.tp==='o'&&pc){await pc.setRemoteDescription(new RTCSessionDescription(m.o));const a=await pc.createAnswer();await pc.setLocalDescription(a);d.m.push({id:me+Math.random(),f:me,to:pid,tp:'a',a,t:Date.now()})}
      else if(m.tp==='a'&&pc)await pc.setRemoteDescription(new RTCSessionDescription(m.a));
      else if(m.tp==='c'&&pc)try{await pc.addIceCandidate(new RTCIceCandidate(m.c))}catch(e){}
      else if(m.tp==='txt')log(m.v,'he');
      else if(m.tp==='bye')stop('Собеседник отключился');
    }
  }
  if(ch)d.m=d.m.filter(x=>x.to!==me);
  return ch;
}),1200);
</script>
</body>
</html>
